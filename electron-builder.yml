appId: ar.ceflyrics.app
productName: CEFLYRICS
copyright: GPL-3.0
directories:
  output: release
files:
  - out/**
  - package.json
  # Solo el binario de Windows: el resto ocupa lugar sin usarse.
  - '!node_modules/better-sqlite3/{deps,src,binding.gyp}'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/better-sqlite3/lib/{darwin,linux,linuxmusl}-*'
  - '!node_modules/node-addon-api/**'
# Sin los otros idiomas de Chromium.
electronLanguages:
  - es
  - es-419
  - en-US
# better-sqlite3 trae binarios Node-API: no hay nada que recompilar.
npmRebuild: false
# La GPL pide entregar la licencia junto con el programa.
extraFiles:
  - LICENSE
  # La licencia OFL pide entregar su texto junto con las fuentes.
  - from: node_modules/@fontsource/inter/LICENSE
    to: licencias/fuente-inter.txt
  - from: node_modules/@fontsource/montserrat/LICENSE
    to: licencias/fuente-montserrat.txt
  - from: node_modules/@fontsource/oswald/LICENSE
    to: licencias/fuente-oswald.txt
  - from: node_modules/@fontsource/lora/LICENSE
    to: licencias/fuente-lora.txt
  - from: node_modules/@fontsource/playfair-display/LICENSE
    to: licencias/fuente-playfair-display.txt
  - from: node_modules/@fontsource/merriweather/LICENSE
    to: licencias/fuente-merriweather.txt
extraResources:
  - from: resources/ceflyrics-control.apk
    to: ceflyrics-control.apk
  - from: resources/bibles.db
    to: bibles.db
win:
  icon: assets/icono.ico
  target: nsis
# Para toda la PC: es lo que permite crear la regla del firewall.
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: always
  shortcutName: CEFLYRICS
  installerIcon: assets/icono.ico
  uninstallerIcon: assets/icono.ico
  installerSidebar: assets/instalador-lateral.bmp
  uninstallerSidebar: assets/instalador-lateral.bmp
  installerHeader: assets/instalador-encabezado.bmp
  installerLanguages:
    - es_ES
  language: '3082'
  artifactName: CEFLYRICS-Instalador-${version}.${ext}
  include: scripts/installer.nsh
