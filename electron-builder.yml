appId: ar.ceflirics.app
productName: CEFLIRICS
copyright: GPL-3.0
directories:
  output: release
files:
  - out/**
  - package.json
# better-sqlite3 trae binarios Node-API: no hay nada que recompilar.
npmRebuild: false
# La GPL pide entregar la licencia junto con el programa.
extraFiles:
  - LICENSE
extraResources:
  - from: resources/bibles.db
    to: bibles.db
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
