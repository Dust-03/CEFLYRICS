plugins {
    id 'com.android.application'
}

// La clave de firma vive fuera del repositorio. Ver docs/plan-control-movil.md.
def signing = new Properties()
def signingFile = rootProject.file('firma.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'ar.ceflirics.control'
    compileSdk 34

    defaultConfig {
        applicationId 'ar.ceflirics.control'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing.storeFile)
                storePassword signing.password
                keyAlias signing.alias
                keyPassword signing.password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
