<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CEFLIRICS · Pantalla</title>
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="pantalla">
    <video id="video" muted playsinline preload="auto"></video>
    <div id="texto" class="capa-texto">
      <div class="texto-caja">
        <p id="texto-cuerpo" class="texto-cuerpo"></p>
        <p id="texto-titulo" class="texto-titulo"></p>
      </div>
    </div>
    <div id="negro" class="capa-negro"></div>
    <div id="espera" class="capa-espera">
      <div class="marca">CEFLIRICS</div>
      <div id="nombre" class="espera-nombre"></div>
      <div id="estado" class="espera-estado">Conectando…</div>
      <div class="barra"><div id="progreso" class="barra-relleno"></div></div>
    </div>
    <div id="aviso-sonido" class="aviso">Tocá la pantalla para activar el sonido</div>
    <pre id="debug" class="debug"></pre>
    <script type="module" src="/pantalla.js"></script>
  </body>
</html>
